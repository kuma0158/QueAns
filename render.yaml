services:
  - type: web
    name: queans
    runtime: node
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/data/db/queans.db
      - key: UPLOAD_ROOT
        value: /data/uploads
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: queans-data
      mountPath: /data
      sizeGB: 1
